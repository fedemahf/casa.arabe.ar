{{ define "main" }}
  <img class="home-logo" src="{{ "images/emblem-of-syria-2025.svg" | relURL }}" alt="Emblema de Siria" width="300" height="225">
  {{ .Content }}
  {{ range site.RegularPages }}
    <section>
      {{ $dateMachine := .Date | time.Format "2006-01-02T15:04:05-07:00" }}
      {{ $dateHuman := .Date | time.Format "2006-01-02" }}
      <p>
        <time datetime="{{ $dateMachine }}">{{ $dateHuman }}</time> &mdash; <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        <br />
        {{ .Summary }}
      </p>
    </section>
  {{ end }}
{{ end }}
